name: Android APK

# ============================================================================
# 安卓安装包（APK）打包工作流
#
# 触发方式两种：
#   1) 打 tag（vX.Y.Z，必须与 package.json 一致）→ 自动打包并挂到 GitHub Release
#   2) 手动触发（Actions 页面点 Run workflow）→ 只产出 Artifact，方便随时出包
#
# 产物是 debug 签名的 APK：
#   - 可以直接安装到手机关闭「纯净模式 / 未知来源」后使用
#   - 不需要配置密钥，适合个人自用
#   - 想换成正式签名的话，见 README「安卓」章节的说明
# ============================================================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: '要打包的分支或 tag（留空则用当前分支）'
        required: false
        default: ''

permissions:
  contents: write

# 同一个 ref 只跑一次，新提交进来时取消旧任务
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'          # Capacitor 8 要求 Node >= 22
  JAVA_VERSION: '21'          # Capacitor 8 / AGP 8.13 要求 JDK 21
  COMPILE_SDK: '36'
  BUILD_TOOLS: '36.0.0'

jobs:
  build-apk:
    name: 打包 APK
    runs-on: ubuntu-latest        # 用 GitHub 的机器，本地不用装 Android SDK
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 安装 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 放在 setup-node 之后，不依赖 runner 自带的 Node；顺便校验 tag 与包内版本一致
      - name: 读取版本号并校验 tag
        id: version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package.json: $VERSION"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $VERSION 不一致"
              exit 1
            fi
          fi

      - name: 安装 JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # ubuntu-latest 镜像自带 Android SDK，不再依赖第三方 setup action：
      # 它会在接受许可时打印协议全文并因交互输入失败，且旧 action 被强制跑在 Node 24 上
      - name: 准备 Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager，SDK_ROOT=$SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT"      >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER"     >> "$GITHUB_ENV"
          echo "sdkmanager: $SDKMANAGER"

          # 直接写入公开的 license hash，绕开 sdkmanager --licenses 的交互式 y/N
          mkdir -p "$SDK_ROOT/licenses"
          printf '%s\n' '8933bad161af4178b1185d1a37fbf41ea5269c55' \
                        'd56f5187479451eabf01fb78af6dfcb131a6481e' \
            > "$SDK_ROOT/licenses/android-sdk-license"
          printf '%s\n' '84831b9409646a918e305bbebab6c9c91394bd58f' \
            > "$SDK_ROOT/licenses/android-sdk-preview-license"

      - name: 安装 Android SDK 组件
        run: |
          # 用镜像自带的 JDK 17 跑 sdkmanager（部分旧版 cmdline-tools 在 JDK 21 下会报错）；
          # 后面的 Gradle 编译仍使用 setup-java 装的 JDK 21
          SDK_JAVA="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          JAVA_HOME="$SDK_JAVA" "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${{ env.COMPILE_SDK }}" \
            "build-tools;${{ env.BUILD_TOOLS }}"

      - name: 安装依赖
        run: npm ci --no-audit --no-fund
        env:
          # 安卓打包用不到 Electron 的二进制，省掉 100MB 下载
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 逻辑自测
        run: npm run test:core

      - name: 组装 Web 产物
        run: npm run build:www

      # Capacitor 会根据 capacitor.config.json 生成原生工程；CI 每次都是干净环境
      # cap add 内部已自动 copy web 资源 + 注册插件，后面的 sync 是幂等兜底
      - name: 生成安卓工程
        run: |
          npx cap add android
          node scripts/android-version.js

      # android-version.js 为了兼容模板变化会静默跳过，这里兜底确认版本真的写进去了，
      # 避免产出一个 versionName 还停在 1.0 的 APK
      - name: 校验 APK 版本已写入
        run: |
          if ! grep -q "versionName \"${{ steps.version.outputs.value }}\"" android/app/build.gradle; then
            echo "::error::versionName 未同步成 ${{ steps.version.outputs.value }}，请检查 scripts/android-version.js 与 Capacitor 模板"
            exit 1
          fi

      - name: 替换启动图标
        run: node scripts/android-icons.js

      - name: 同步 Web 资源到安卓工程
        run: npx cap sync android

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'capacitor.config.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 编译 APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p dist-release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist-release/Zinsight-${{ steps.version.outputs.value }}-android.apk"
          ls -lh dist-release

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zinsight-android-${{ steps.version.outputs.value }}
          path: dist-release/*.apk
          if-no-files-found: error
          retention-days: 30

      # 打 tag 时同时挂到 Release，和桌面端产物放在一起。
      # 两个 workflow 会并发跑，先确保 Release 存在，避免同时创建撞车
      - name: 确保 Release 存在
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release 已存在"
          else
            # 若桌面端 workflow 抢先创建，create 会失败；此时再 view 一次确认确实存在
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi

      - name: 挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
